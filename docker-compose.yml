# Local stack: the server + Postgres (source of truth) + Mailpit (dev SMTP sink).
# Redis/river/etc. arrive in later stages.
#
#   docker compose up --build
#   curl http://localhost:8080/healthz         # liveness
#   curl http://localhost:8080/readyz          # liveness + DB ping
#   open  http://localhost:8025                # Mailpit web UI (sent emails)
services:
  app:
    build:
      context: .
      args:
        VERSION: dev
        COMMIT: none
        BUILD_DATE: compose
    ports:
      # Host port is overridable: `TYPEMORE_HOST_PORT=8090 docker compose up app`
      # if 8080 is taken on your machine. Container always listens on 8080.
      - "${TYPEMORE_HOST_PORT:-8080}:8080"
    environment:
      TYPEMORE_ADDR: ":8080"
      TYPEMORE_LOG_FORMAT: "json"
      TYPEMORE_LOG_LEVEL: "info"
      # Empty = allow any WebSocket Origin (development default). Set an
      # allow-list (comma-separated) in production.
      TYPEMORE_ALLOWED_ORIGINS: ""
      # Reach Postgres/Mailpit by their compose service names.
      TYPEMORE_DATABASE_URL: "postgres://typemore:typemore@postgres:5432/typemore?sslmode=disable"
      TYPEMORE_SMTP_HOST: "mailpit"
      TYPEMORE_SMTP_PORT: "1025"
      TYPEMORE_SMTP_FROM: "no-reply@typemore.local"
      TYPEMORE_FRONTEND_ORIGIN: "http://localhost:5173"
      TYPEMORE_COOKIE_SECURE: "false"
      # OAuth: values come from your local (gitignored) .env or shell env — never
      # hard-coded here. OAUTH_REDIRECT_BASE must match the callback registered
      # with the provider (default http://localhost:8080).
      TYPEMORE_OAUTH_REDIRECT_BASE: "${TYPEMORE_OAUTH_REDIRECT_BASE:-http://localhost:8080}"
      TYPEMORE_GITHUB_CLIENT_ID: "${TYPEMORE_GITHUB_CLIENT_ID:-}"
      TYPEMORE_GITHUB_CLIENT_SECRET: "${TYPEMORE_GITHUB_CLIENT_SECRET:-}"
      TYPEMORE_GOOGLE_CLIENT_ID: "${TYPEMORE_GOOGLE_CLIENT_ID:-}"
      TYPEMORE_GOOGLE_CLIENT_SECRET: "${TYPEMORE_GOOGLE_CLIENT_SECRET:-}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Runs `goose up` against Postgres, then exits. `app` does not run migrations
  # itself (keeps startup dumb); bring the schema up with this one-shot.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      TYPEMORE_DATABASE_URL: "postgres://typemore:typemore@postgres:5432/typemore?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: typemore
      POSTGRES_PASSWORD: typemore
      POSTGRES_DB: typemore
    ports:
      # Host port is overridable and defaults to 5433 so it never collides with
      # a native Postgres already bound to 5432 on the host. Container always
      # listens on 5432; the host DSN must target this published port.
      - "${TYPEMORE_DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typemore -d typemore"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    restart: unless-stopped

volumes:
  pgdata:
