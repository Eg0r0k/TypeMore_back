version: "2"
sql:
  - engine: postgresql
    # Schema is read from the goose migration files (sqlc understands the goose
    # up/down annotations), so there is a single source of truth for the schema.
    schema: db/migrations
    queries: internal/auth/queries.sql
    gen:
      go:
        package: authdb
        out: internal/auth/authdb
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          # Use google/uuid.UUID (registered as a pgx codec) instead of the
          # clunky pgtype.UUID, so domain code handles ids naturally.
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          # citext is just a case-insensitive text; map it to string.
          - db_type: citext
            go_type: string
          - db_type: citext
            nullable: true
            go_type:
              type: string
              pointer: true
          # timestamptz -> time.Time (pgx scans/encodes it natively), avoiding
          # the pgtype.Timestamptz wrapper in domain code.
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
  - engine: postgresql
    schema: db/migrations
    queries: internal/runs/queries.sql
    gen:
      go:
        package: runsdb
        out: internal/runs/runsdb
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: citext
            go_type: string
          - db_type: citext
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          # jsonb columns are opaque snapshots; keep them as raw JSON so the
          # adapter passes bytes straight through without re-encoding.
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
  - engine: postgresql
    schema: db/migrations
    queries: internal/replay/queries.sql
    gen:
      go:
        package: replaydb
        out: internal/replay/replaydb
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: citext
            go_type: string
          - db_type: citext
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          # jsonb columns are opaque snapshots; keep them as raw JSON so the
          # adapter passes bytes straight through without re-encoding.
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
  - engine: postgresql
    schema: db/migrations
    queries: internal/leaderboard/queries.sql
    gen:
      go:
        package: leaderboarddb
        out: internal/leaderboard/leaderboarddb
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: citext
            go_type: string
          - db_type: citext
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
          # wpm/raw/acc are stored exact (numeric) but every producer and
          # consumer of them is a JSON double, so scan them as float64 rather
          # than dragging pgtype.Numeric through the domain. Nothing in Go ever
          # WRITES them: the projection copies numeric to numeric inside SQL.
          - db_type: pg_catalog.numeric
            go_type: float64
  - engine: postgresql
    schema: db/migrations
    queries: internal/quote/queries.sql
    gen:
      go:
        package: quotedb
        out: internal/quote/quotedb
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: citext
            go_type: string
          - db_type: citext
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
  - engine: postgresql
    schema: db/migrations
    queries: internal/profile/queries.sql
    gen:
      go:
        package: profiledb
        out: internal/profile/profiledb
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: citext
            go_type: string
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          # Day buckets come back as plain dates; the handler formats them
          # YYYY-MM-DD, so time.Time is the natural carrier.
          - db_type: date
            go_type: time.Time
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
          # Aggregate results are JSON doubles end to end.
          - db_type: pg_catalog.numeric
            go_type: float64
  - engine: postgresql
    schema: db/migrations
    queries: internal/moderation/queries.sql
    gen:
      go:
        package: moderationdb
        out: internal/moderation/moderationdb
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: citext
            go_type: string
          - db_type: citext
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: pg_catalog.numeric
            go_type: float64
