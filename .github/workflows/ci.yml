name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  test:
    name: test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Linux runners have a C toolchain, so the race detector works here even
      # though it may not on a bare Windows dev box.
      #
      # -timeout 25m, because go's default is 10m PER PACKAGE and two packages
      # do not fit in it: internal/replay and internal/runs each spend minutes
      # in a real Postgres via testcontainers, and the race detector roughly
      # doubles that. Hitting the default does not read as "too slow" — the
      # package panics, and the panic buries whatever actually went wrong under
      # a stack dump of every live goroutine.
      - name: go test -race
        run: go test -race -timeout 25m ./...

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build ./...
